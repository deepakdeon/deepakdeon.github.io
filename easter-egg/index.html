<style>
:root{--bg:#0a0a0f;--ink:#f2f0ea;--dim:#a7a7b3;--card:#15151f;--line:#262633}
[data-theme="light"]{--bg:#f7f6f1;--ink:#17171d;--dim:#5f5f6a;--card:#ffffff;--line:#ddd9cd}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;padding:24px 16px 48px}
main{max-width:640px;margin:0 auto;text-align:center}
h1{font-size:clamp(2rem,8vw,3.5rem);margin:32px 0 12px;color:#c8f542}
.sub{font-size:clamp(1rem,4vw,1.3rem);margin:0;opacity:.85}
.back{margin-top:24px;font-size:.95rem}
.back a{color:#4da6ff;text-decoration:underline}
.set-title{margin-top:24px;font-size:clamp(1.3rem,5vw,1.8rem)}
.quiz{margin-top:16px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.progress{display:flex;justify-content:space-between;font-size:.9rem;color:var(--dim);margin-bottom:10px}
.timer{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:6px}
.timer b{font-size:1.1rem;transition:color 1.5s ease}
.tbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:20px}
.tbar i{display:block;height:100%;background:#1faa53;width:100%;transition:width 1s linear,background-color 1.5s ease}
.q{font-size:1.25rem;line-height:1.5;margin:0 0 18px}
.opt{display:block;width:100%;text-align:left;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin:0 0 10px;font-size:1rem;font-family:inherit;cursor:pointer;transition:background .25s ease,transform .15s ease}
.opt:active{transform:scale(.99)}
.opt:disabled{cursor:default;opacity:1}
.opt.correct{background:#1faa53;border-color:#1faa53;color:#fff}
.opt.wrong{background:#e53935;border-color:#e53935;color:#fff}
.opt.dim{opacity:.55}
.feedback{min-height:24px;font-weight:700;margin-top:6px}
.feedback.ok{color:#1faa53}
.feedback.no{color:#e53935}
.result{text-align:center}
.result .big{font-size:3rem;font-weight:700;margin:8px 0}
.result p{color:var(--dim)}
.result p.m-red{color:#e53935}
.result p.m-yellow{color:#eab308}
.result p.m-green{color:#1faa53}
.btn{background:#4da6ff;border:0;color:#fff;border-radius:12px;padding:13px 26px;font-size:1rem;font-family:inherit;cursor:pointer;margin-top:16px}
#startBtn{background:#1faa53;animation:startGlow 1.8s ease-in-out infinite}
@keyframes startGlow{0%,100%{box-shadow:0 0 0 0 rgba(31,170,83,.5)}50%{box-shadow:0 0 24px 6px rgba(31,170,83,.5)}}
.countpop{animation:countPop .3s ease}
@keyframes countPop{from{transform:scale(.7);opacity:.3}to{transform:scale(1);opacity:1}}
.confetti{animation:confettiBurst 1s ease-out forwards}
@keyframes confettiBurst{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
.shake{animation:shakeAnim .45s ease}
@keyframes shakeAnim{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.catpill{background:rgba(0,102,255,.12);border:1.5px solid rgba(0,102,255,.55);color:#1a7aff;border-radius:999px;padding:6px 16px;font-size:.85rem;font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none}
.catpill.on{background:#0066ff;color:#fff;border-color:#0066ff}
.pill-pop{animation:pillPop .3s ease}
@keyframes pillPop{0%{transform:scale(1)}40%{transform:scale(.88)}100%{transform:scale(1)}}
</style>
</head>

<script>
const SETS = [
  { title: 'Quiz set #30', cat: 'FUN', questions: [{"q": "\"നിന്റെയൊക്കെ കളി ഈ ______ അല്ലേ നടക്കൂ, ധൈര്യം ഉണ്ടേൽ ഇന്ത്യയിലേക്ക് വാടാ!\"", "options": ["മലപ്പുറത്ത്", "മധ്യപ്രദേശിൽ", "തമിഴ്‌നാട്ടിൽ", "ജപ്പാനിൽ"], "answer": 2}, {"q": "\"ലവൻ ______, നീ പാടുപെടും!\"", "options": ["പാടുന്നു", "ആടുന്നു", "ഓടുന്നു", "ചാടുന്നു"], "answer": 0}, {"q": "\"തീരുമ്പോ തീരുമ്പോ പണി തരാൻ ഞാനെന്താ ______ വന്ന ഭൂതാ?\"", "options": ["പാർലമെന്റീന്ന്", "അമേരിക്കേന്ന്", "കുപ്പീന്ന്", "ടിക് ടോക്കീന്ന്"], "answer": 2}, {"q": "\"_____ ഇപ്പൊ യുദ്ധം ഒന്നും ഇല്ലേ?\"", "options": ["പുരുഷുവിന്", "രമണന്", "സുഗുണന്", "മേജർ രവിക്ക്"], "answer": 0}, {"q": "\"ഭവാനി ഒന്നു മനസ്സുവെച്ചാൽ നമുക്കീ _____ ഒരു മണിയറയാക്കാം.\"", "options": ["കപ്പവറ", "നിലവറ", "കലവറ", "കുളിമുറി"], "answer": 2}, {"q": "CID Moosa ലെ മൂ.സ എന്നത് എന്തിന്റെ ചുരുക്കപ്പേരാണ്?", "options": ["മുൻഷി ശശി", "മൂലംകുഴിയിൽ സഹദേവൻ", "മൂലംകുഴിയിൽ സദാനന്ദൻ", "മുണ്ടൂർ സാബു"], "answer": 1}, {"q": "ഈ ചോദ്യങ്ങൾ ഒക്കെ തയ്യാറാക്കിയത് ആരാണെന്നാണ് പറഞ്ഞത്?", "options": ["Deonnn", "ലുട്ടാപ്പി", "ഡാകിനി", "കുട്ടൂസൻ"], "answer": 0}, {"q": "സാഗർ ഏലിയാസ് ജാക്കിക്ക് പണ്ട് എന്തിന്റെ കച്ചവടം ആയിരുന്നു?", "options": ["മഞ്ചാടിക്കുരു", "മയക്കുമരുന്ന്", "മത്തി", "ബിസ്ക്കറ്റ്"], "answer": 3}, {"q": "\"യെവാളുതേ ______. അരി - അയിനാണ്!\"", "options": ["ഇക്കരേലു", "അക്കരേലു", "ചക്കരേലു", "മുക്കരേലു"], "answer": 1}, {"q": "പറക്കും തളിക മുതലാളി ഉണ്ണിയുടെ അച്ഛൻ താമരാക്ഷൻപിള്ള മരിച്ചത് എങ്ങനെയാണ്?", "options": ["ആന കുത്തി", "ബസ്സ് ഇടിച്ച്", "അറ്റാക്ക് വന്ന്", "മരിച്ചിട്ടില്ല"], "answer": 1}, {"q": "‘ഇൻ ഹരിഹർ നഗർ’ സിനിമയിൽ അപ്പുക്കുട്ടൻ എന്ന കഥാപാത്രത്തെ അവതരിപ്പിച്ചത് ആരാണ്?", "options": ["ജഗദീഷ്", "മുകേഷ്", "സിദ്ദിഖ്", "അശോകൻ"], "answer": 0}, {"q": "‘നാടോടിക്കാറ്റ്’ സിനിമയിൽ വിജയൻ എന്ന കഥാപാത്രത്തെ അവതരിപ്പിച്ചത് ആരാണ്?", "options": ["ശ്രീനിവാസൻ", "മുകേഷ്", "ജഗതി ശ്രീകുമാർ", "ഇന്നസെന്റ്"], "answer": 0}] },
  { title: 'Quiz set #31', cat: 'FUN', questions: [{"q": "ചേക്കിലെ വിഷുദിനത്തിൽ പിള്ളേച്ചൻ എത്ര ചന്തിയാണ് കണി കണ്ടത്?", "options": ["3", "6", "4", "5"], "answer": 3}, {"q": "\"അപ്പുവേട്ടൻ എന്നെ സ്നേഹിക്കുന്നതിന്റെ ______ ഇരട്ടി ഞാനെന്റെ മൊയ്തീനെ സ്നേഹിക്കുന്നുണ്ട്.\"", "options": ["നൂറ്", "പതിനായിരം", "രണ്ട്", "ആയിരം"], "answer": 3}, {"q": "പ്യാരി മോഷ്ടിക്കാൻ ശ്രമിച്ച 'ഡെഡ്ബോഡിയുടെ അണ്ടർവെയർ' ഏത് നിറത്തിൽ ഉള്ളതായിരുന്നു?", "options": ["കറുപ്പ്", "പച്ച", "നീല", "ചുവപ്പ്"], "answer": 3}, {"q": "തെക്കോട്ടു തിരിച്ചു വെച്ചാൽ ലക്ഷണക്കേടാണെന്ന് രാമൻകുട്ടിയുടെ മുത്തച്ഛൻ പറയുന്നത് എന്തിനെക്കുറിച്ചാണ്?", "options": ["കുണ്ടി", "കിണ്ടി", "ഉരൽ", "ഉലക്ക"], "answer": 1}, {"q": "\"തെറി കേട്ടിട്ട് ഇവളുടെ വീട് _______ ഭാഗത്തെവിടെയോ ആണെന്നു തോന്നുന്നു.\"", "options": ["കൊടുങ്ങല്ലൂർ", "തൃശ്ശൂർ", "ആമ്പല്ലൂർ", "മലയാറ്റൂർ"], "answer": 0}, {"q": "\"______ ആണ് സാറേ ഇവന്റെ മെയിൻ!'", "options": ["ശക്തി", "വിവരം", "ബുദ്ധി", "അറിവ്"], "answer": 2}, {"q": "\"മധ്യതിരുവിതാംകൂർ ഭരിച്ചിരുന്ന രാജാവാ, പേര് _____.\"", "options": ["ശശി", "മാർത്താണ്ഡവർമ്മ", "സാബു", "സോമൻ"], "answer": 0}, {"q": "കർണ്ണൻ നെപ്പോളിയൻ എന്നിവരെക്കൂടാതെ ആരാണ് സാം അലക്സിന്റെ ഹീറോ?", "options": ["ഭഗത് സിംഗ്", "ഹർഭജൻ സിങ്", "ഋഷിരാജ് സിങ്", "മൻമോഹൻ സിംഗ്"], "answer": 0}, {"q": "'ആന്റണി മോസസ്' ഏത് സിനിമയിലെ കഥാപാത്രമാണ്?", "options": ["രണം", "മുംബൈ പോലീസ്", "ബ്രദേഴ്‌സ് ഡേ", "എസ്ര"], "answer": 1}, {"q": "ജിംസി അറിയാതെ മഹേഷ് എടുത്ത ജിംസിയുടെ ഫോട്ടോ ഏത് മാസികയുടെ കവർചിത്രമായാണ് അച്ചടിച്ചു വന്നത്?", "options": ["മംഗളം", "മനോരമ", "നാന", "മഞ്ചാടി"], "answer": 3}, {"q": "'പല്ലവി' ഏത് സിനിമയിലെ കഥാപാത്രമാണ്?", "options": ["ടേക്ക് ഓഫ്", "ഉയരെ", "കൂടെ", "വൈറസ്"], "answer": 1}, {"q": "താഴെ കൊടുത്തവയിൽ അൻവർ റഷീദ് ചിത്രം അല്ലാത്തത് തിരഞ്ഞെടുക്കുക...", "options": ["ഉസ്താദ് ഹോട്ടൽ", "അണ്ണൻ തമ്പി", "ആൻമരിയ കലിപ്പിലാണ്", "ഛോട്ടാ മുംബൈ"], "answer": 2}] },

function poolFor(c) { return c ? SETS.filter(s => s.cat === c) : SETS; }

let curSet = null, QUESTIONS = [], QUIZ = [];
function pickSet() {
  const pool = poolFor(cat);
  const note = document.getElementById('catNote');
  if (!pool.length) {
    curSet = null; QUESTIONS = []; QUIZ = [];
    document.querySelector('.set-title').textContent = 'Coming soon';
    if (note) note.textContent = 'FUN sets coming soon';
    return;
  }
  if (note) note.textContent = '';
  const key = cat ? 'dd-quizset-' + cat : 'dd-quizset';
  let pi = 0;
  try {
    const n = parseInt(localStorage.getItem(key) || '0', 10);
    pi = isNaN(n) ? 0 : n % pool.length;
    localStorage.setItem(key, String(pi + 1));
  } catch (e) {}
  curSet = pool[pi];
  document.querySelector('.set-title').textContent = curSet.title;
  QUESTIONS = curSet.questions;
  QUIZ = shuffle(QUESTIONS.map(q => {
    const opts = q.options.map((text, i) => ({ text, correct: i === q.answer }));
    shuffle(opts);
    return { q: q.q, options: opts.map(o => o.text), answer: opts.findIndex(o => o.correct) };
  }));
}
function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

let idx = 0, score = 0, locked = false, timerId = null, timeLeft = 15, qStart = 0;

function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
function hexRgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
const TSTOPS = [[100, '#1faa53'], [70, '#eab308'], [40, '#f97316'], [10, '#e53935'], [0, '#e53935']];
function blendColor(pct) {
  for (let i = 0; i < TSTOPS.length - 1; i++) {
    const p1 = TSTOPS[i][0], p2 = TSTOPS[i + 1][0];
    if (pct <= p1 && pct >= p2) {
      const f = p1 === p2 ? 0 : (p1 - pct) / (p1 - p2);
      const a = hexRgb(TSTOPS[i][1]), b = hexRgb(TSTOPS[i + 1][1]);
      const m = a.map((v, k) => Math.round(v + (b[k] - v) * f));
      return 'rgb(' + m[0] + ',' + m[1] + ',' + m[2] + ')';
    }
  }
  return TSTOPS[TSTOPS.length - 1][1];
}
function paintTimer() {

}
function startTimer() {

function render() {

  const r = el.getBoundingClientRect();

  const colors = ['#1faa53', '#c8f542', '#eab308', '#4da6ff', '#e84fc0', '#ffffff'];
  for (let k = 0; k < 40; k++) {
    const s = document.createElement('span');

    s.style.cssText = 'position:fixed;left:' + cx + 'px;top:' + cy + 'px;width:' + size + 'px;height:' + size + 'px;background:' + colors[k % colors.length] + ';border-radius:' + (Math.random() > 0.5 ? '50%' : '2px') + ';pointer-events:none;z-index:9999;';
    const ang = Math.random() * Math.PI * 2;
    const dist = 60 + Math.random() * 120;
    s.style.setProperty('--dx', Math.cos(ang) * dist + 'px');

    s.className = 'confetti';

    s.addEventListener('animationend', () => s.remove());
  }
}

}
